---
deployment:
  tasks:
    - export DEPLOYPATH=/home/gofeevoc/public_html/finanzas
    - /bin/cp -R api $DEPLOYPATH
    - /bin/cp -R css $DEPLOYPATH
    - /bin/cp -R img $DEPLOYPATH
    - /bin/cp -R js $DEPLOYPATH
    - /bin/cp -R mcp $DEPLOYPATH
    - /bin/cp icon-180.png $DEPLOYPATH
    - /bin/cp icon-192.png $DEPLOYPATH
    - /bin/cp icon-512.png $DEPLOYPATH
    - /bin/cp index.html $DEPLOYPATH
    - /bin/cp manifest.webmanifest $DEPLOYPATH
    - /bin/cp sw.js $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH
    - /bin/mkdir -p /home/gofeevoc/public_html/.well-known
    - /bin/cp -R well-known/. /home/gofeevoc/public_html/.well-known/
